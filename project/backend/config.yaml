camera:
  source: "0"
  fps: 10
  resolution: [640, 360]

capture:
  pre_buffer_sec: 3
  post_buffer_sec: 4
  motion_threshold: 1200
  stillness_sec: 2.0

live_search:
  enabled: true
  model: "yolov8s-worldv2.pt"
  confidence: 0.40
  device: "auto"
  infer_interval_sec: 1.2
  input_max_side: 256

quick_search:
  use_clip: true
  thumbnail_only: true
  sample_fps: 1
  batch_size: 2
  top_k: 3
  clip_model: "ViT-B/32"
