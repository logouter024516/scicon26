# 카메라 설정
camera:
  device_id: 0  # 웹캠 인덱스 (0 = 기본 카메라)
  resolution:
    width: 1280
    height: 720
  fps: 30

# 배경 모델링 설정
background_subtraction:
  method: "MOG2"  # MOG2 또는 KNN
  history: 1000  # 배경 학습 프레임 수 (증가: 더 안정적인 배경 모델)
  var_threshold: 25  # 분산 임계값 (증가: 노이즈 감소)
  detect_shadows: true
  learning_rate: -1  # 자동 학습률 (-1 = 자동)
  background_learning_frames: 150  # 초기 배경 학습에 필요한 프레임 수

# 새 물체 감지 설정
object_detection:
  static_duration: 2.5  # 물체가 정적으로 유지되어야 하는 시간 (초)
  min_contour_area: 800  # 최소 윤곽선 영역 (픽셀, 증가: 작은 노이즈 제거)
  stability_threshold: 0.80  # 안정성 임계값 (0~1, 약간 완화)
  max_tracking_distance: 80  # 같은 물체로 판단할 최대 거리 (픽셀)
  min_tracking_frames: 30  # 이벤트로 인정할 최소 추적 프레임 수

# 클립 저장 설정
clip_recording:
  buffer_seconds: 10.0  # 롤링 버퍼 유지 시간 (초)
  pre_event_seconds: 5.0  # 이벤트 전 포함할 시간 (초)
  post_event_seconds: 5.0  # 이벤트 후 포함할 시간 (초)
  codec: "mp4v"  # 비디오 코덱 (mp4v, avc1, xvid 등)
  fps: 30

# YOLO-World 설정 (Stage 4+)
yolo:
  model: "yolov8x-worldv2"
  confidence: 0.25
  iou_threshold: 0.45
  device: "cuda"  # cuda 또는 cpu

# CLIP 설정 (Stage 4+)
clip:
  model: "ViT-B/32"
  device: "cuda"  # cuda 또는 cpu

# 저장 경로
storage:
  clips_dir: "data/clips"
  meta_dir: "data/meta"
  thumbs_dir: "data/thumbs"
  max_storage_gb: 50

# 로깅 설정
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/missingfind.log"

# 검색 설정 (Stage 5+)
search:
  sample_fps: 1.0  # 클립 분석 시 샘플링 fps
  top_k: 10  # 반환할 최대 결과 수
  similarity_threshold: 0.3  # 최소 유사도 임계값
